[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-speedrun"
version = "0.1.0"
description = "Crawlora Speedrun.com API client with 20 endpoints for game and category discovery, leaderboards, records, variables, and run metadata"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "speedrun", "speedrun-com", "speedrun-api", "speedrun-com-api", "speedrun-scraper", "speedrun-com-scraper", "speedrun-data", "speedrun-com-data", "speedrun-game-category-discovery", "speedrun-leaderboards", "speedrun-records", "speedrun-variables", "speedrun-run-metadata"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=speedrun-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=speedrun-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-speedrun"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_speedrun"]

[tool.setuptools.package-data]
"crawlora_speedrun" = ["py.typed", "*.pyi"]
